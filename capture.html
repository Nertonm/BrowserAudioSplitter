<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capture</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    #status {
      padding: 15px;
      background-color: #fff;
      border-radius: 5px;
      margin-bottom: 20px;
      border-left: 4px solid #4CAF50;
    }
    #preview {
      width: 100%;
      margin-bottom: 20px;
    }
    button {
      background-color: #f44336;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <div>
    <p id="status">Initializing capture...</p>
    <audio id="preview" autoplay controls></audio>
    <div>
      <button id="stopBtn">Stop Capture</button>
    </div>
  </div>
  <script src="capture.js"></script>
</body>
</html>
